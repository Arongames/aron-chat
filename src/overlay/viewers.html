<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Второй виджет: только счётчики зрителей. Прозрачный фон для OBS -->
  <title>Aron Chat — зрители</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/overlay.css" />
  <link rel="stylesheet" href="/custom.css?widget=viewers" />
</head>
<body data-widget="viewers">
  <div class="wrap pos-top-left" id="wrap">
    <div class="bar" id="bar">
      <span class="v-title">Зрители</span>
      <span class="viewers" id="viewers">
        <span class="v-item"><img class="v-logo" src="/youtube-logo.svg" alt="YouTube" /><b data-v="youtube">—</b></span>
        <span class="v-item"><img class="v-logo" src="/twitch-logo.svg" alt="Twitch" /><b data-v="twitch">—</b></span>
        <span class="v-item"><img class="v-logo" src="/tiktok-logo.svg" alt="TikTok" /><b data-v="tiktok">—</b></span>
      </span>
    </div>
  </div>

  <div class="status" id="status">Нет связи с приложением — переподключение…</div>

  <script src="/overlay.js"></script>
</body>
</html>
